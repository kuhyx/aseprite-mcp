[project]
name = "aseprite-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]==2.0.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aseprite_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # Missing docstring in public module
    "CPY001",   # Missing copyright notice
    "TID252",   # Relative imports from parent modules
    "COM812",   # Trailing comma missing (conflicts with formatter)
    "E501",     # Line too long (Lua script strings embedded in source)
    "S603",     # subprocess call: check for untrusted input
    "S607",     # Starting a process with a partial executable path
    "FBT001",   # Boolean-typed positional argument in function definition
    "FBT002",   # Boolean default positional argument in function definition
    "PLR0913",  # Too many arguments in function definition
    "PLR0917",  # Too many positional arguments
    "ASYNC240", # avoid blocking calls in async functions (open())
    "D203",     # incorrect-blank-line-before-class (conflicts with D211, keep D211)
    "D213",     # multi-line-summary-second-line (conflicts with D212, keep D212)
]

[tool.ruff.lint.pylint]
max-returns = 7

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of assert
    "D103",     # Missing docstring in public function
    "INP001",   # Implicit namespace package
    "PLR2004",  # Magic value used in comparison
    "S108",     # Probable insecure usage of temp file/directory
    "SLF001",   # Private member accessed (white-box unit tests of internals)
]
